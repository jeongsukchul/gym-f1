# This file contains training-specific gym parameters.
# Additional defaults in public `gymkhana.drift_config` preset

# =================================
#   DEFAULT AND DRIFT/RACE CONFIG
# =================================

# Environment
project_name: "f1tenth-ppo-drift"
race_training_mode: "race"
timestep: 0.01
max_episode_steps: 4096
progress_gain: 5.0
out_of_bounds_penalty: -50.0
negative_vel_penalty: -1.0
slip_reward_enabled: true
slip_reward_path_weight: 1.
slip_reward_slip_weight: 0.
slip_reward_target_deg: 40.0
slip_reward_width_deg: 15.0
slip_reward_shape: 2.5

# LiDAR beams config - keep minimal for fast training, as it isn't needed
num_beams: 2

# Map
map: "CircleDrift"
# Multi-map training (optional)
# If specified, parallel environments will train on different maps from this list
# See /train/training_utils.py make_subprocvecenv
track_pool:
  - "Drift"
  - "Drift_mirror"
  # - "Drift2"
  # - "Drift2_mirror"
# For single-map training, set to null or comment out:
# track_pool: null

# Standalone evaluation (`--m e`/`--m d`) uses this pool instead of the
# training-time track_pool above. Keep one entry for single-track eval.
evaluation_track_pool:
  - "CircleDrift"

# Observation
record_obs_min_max: true
sparse_width_obs: true
lookahead_n_points: 5
lookahead_ds: 0.5
normalize_obs: true
mask_track_obs: true  # zero curvature/width lookahead channels for CircleDrift ablation
obs_history_len: 6    # stack recent observations for dynamics/friction inference
obs_delay_min_steps: 1  # per-episode UniformInt lower bound, in policy-observation steps
obs_delay_max_steps: 3  # per-episode UniformInt upper bound, inclusive
sensor_noise_enabled: true
sensor_noise_s_std: 0.005       # [m] centerline arc-length measurement noise; affects lookahead sampling only
sensor_noise_n_std: 0.005       # [m] lateral Frenet measurement noise before normalization
sensor_noise_psi_std_deg: .5  # [deg] heading-error measurement noise before normalization

# Reset configuration
track_direction: "random"
prevent_instability: true # enables integration instability checking with reset
dr_clip_k: 3.0
steering_delay_steps: 2

# Rendering/Debug settings
# Keep callback/standalone evaluation headless by default. Use `--r` for a
# single visual rollout on a machine with a display.
test_debug_render: false
train_debug_render: false

# Callback config
ckpt_save_freq: 10000 # reused for EvalCallback and custom CurriculumLearningCallback
n_eval_episodes: 15

# =================================
#   RECOVERY MODE CONFIG
# =================================

recovery_project_name: "f1tenth-ppo-recover"
recovery_training_mode: "recover"
recovery_track_pool: null # train only on IMS

# Domain randomization for Gym/SB3 - multiplicative Gaussian noise from N(1, sigma).
# JAX sampler PPO uses rl_config.yaml:jax_sampler_ppo.domain_randomization_ranges instead.
# comment out to disable DR
domain_randomization:
  m: 0.05         # mass
  I_z: 0.02       # yaw inertia
  lf: 0.05        # CoG fore-distance; lr auto-tracks (wheelbase preserved)
  s_max: 0.03     # max steering angle; s_min auto-mirrors
  sv_max: 0.02    # max steering velocity; sv_min auto-mirrors

# Curriculum learning - gradually expand recovery state ranges
curriculum:
  # see train/callbacks.py for more details about parameter uses
  enabled: false
  n_stages: 6
  window_size: 500
  success_threshold: 0.8
  min_episodes_between_expansions: 1000
  max_curriculum_timestep: null
  # Each range: [initial_lo, initial_hi, max_lo, max_hi]
  v_range:    [5.0, 9.0, 2.0, 12.0]
  beta_range: [-0.10, 0.10, -0.349, 0.349]
  r_range:    [-0.20, 0.20, -0.785, 0.785]
  yaw_range:  [-0.20, 0.20, -0.785, 0.785]
